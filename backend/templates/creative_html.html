<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{name} - Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <style>
        body { font-family: 'Space Grotesk', ui-sans-serif, system-ui, sans-serif; }
        .blob {
            position: absolute;
            border-radius: 9999px;
            filter: blur(90px);
            opacity: .45;
            pointer-events: none;
            animation: floaty 16s ease-in-out infinite;
        }
        .blob-2 { animation-delay: -6s; }
        .blob-3 { animation-delay: -11s; }
        @keyframes floaty {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(50px, -40px) scale(1.15); }
        }
        @media (prefers-reduced-motion: reduce) {
            * { animation: none !important; transition: none !important; }
        }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 font-sans pt-16 selection:bg-pink-500 selection:text-white overflow-x-hidden">

    <!-- Sticky Nav -->
    <nav class="fixed w-full top-0 z-50 bg-gray-950/70 backdrop-blur-xl border-b border-white/10">
        <div class="max-w-5xl mx-auto px-6 py-4 flex justify-between items-center">
            <a href="#about" class="font-bold text-xl bg-clip-text text-transparent bg-gradient-to-r from-purple-400 to-pink-500">{name}</a>
            <div class="hidden sm:flex gap-8 text-sm font-bold text-gray-300 items-center">
                <a href="#about" class="hover:text-pink-400 transition">Start</a>
                <a href="#experience" class="hover:text-pink-400 transition">Journey</a>
                <a href="#skills" class="hover:text-pink-400 transition">Skills</a>
                <a href="#contact" class="bg-gradient-to-r from-purple-500 to-pink-500 hover:opacity-90 px-5 py-2 rounded-full text-white transition shadow-lg shadow-pink-500/30">Say Hello</a>
            </div>
        </div>
    </nav>

    <!-- Hero -->
    <header id="about" class="relative overflow-hidden" data-aos="fade-up">
        <div class="blob w-96 h-96 bg-purple-600 -top-24 -left-24" aria-hidden="true"></div>
        <div class="blob blob-2 w-80 h-80 bg-pink-600 top-1/3 -right-24" aria-hidden="true"></div>
        <div class="blob blob-3 w-72 h-72 bg-orange-500 bottom-[-80px] left-1/3" aria-hidden="true"></div>
        <div class="relative max-w-4xl mx-auto px-6 py-36 md:py-44 text-center">
            <p class="text-xs md:text-sm tracking-[.4em] uppercase text-pink-400 font-semibold mb-8">Hi, I'm</p>
            <h1 class="text-6xl md:text-8xl font-bold tracking-tight mb-6 text-transparent bg-clip-text bg-gradient-to-r from-purple-400 via-pink-500 to-orange-400">{name}</h1>
            <h2 class="text-2xl md:text-3xl text-gray-300 font-light mb-10">{title}</h2>
            <p class="text-lg md:text-xl text-gray-400 max-w-2xl mx-auto leading-relaxed mb-12">{summary}</p>
            <div class="flex flex-wrap justify-center gap-4">
                <a href="#experience" class="bg-gradient-to-r from-purple-500 to-pink-500 hover:opacity-90 px-8 py-4 rounded-full font-bold transition shadow-xl shadow-pink-500/30 hover:-translate-y-1">
                    <i class="fa-solid fa-bolt mr-2"></i>View My Work
                </a>
                <a href="#contact" class="border-2 border-white/20 hover:border-pink-400 hover:text-pink-300 px-8 py-4 rounded-full font-bold transition hover:-translate-y-1">
                    <i class="fa-solid fa-comment mr-2"></i>Say Hello
                </a>
            </div>
            <div class="mt-10 flex justify-center gap-4">
                <a href="{linkedin}" target="_blank" rel="noopener" class="w-12 h-12 rounded-full border border-white/15 bg-white/5 flex items-center justify-center text-xl text-gray-300 hover:text-pink-400 hover:border-pink-400 transition"><i class="fa-brands fa-linkedin-in"></i></a>
                <a href="{github}" target="_blank" rel="noopener" class="w-12 h-12 rounded-full border border-white/15 bg-white/5 flex items-center justify-center text-xl text-gray-300 hover:text-pink-400 hover:border-pink-400 transition"><i class="fa-brands fa-github"></i></a>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-6 py-20">

        {all_sections}

        <!-- Contact -->
        <section id="contact" data-aos="fade-up">
            <div class="grid md:grid-cols-5 rounded-3xl overflow-hidden border border-white/10 bg-gray-900/60 backdrop-blur-xl shadow-2xl">
                <div class="md:col-span-2 bg-gradient-to-br from-purple-600 to-pink-600 text-white p-10 flex flex-col justify-between">
                    <div>
                        <h3 class="text-3xl font-bold mb-3">Get In Touch</h3>
                        <p class="text-purple-100 leading-relaxed mb-10">Got a wild idea or a project worth building? Drop a message — let's make it real.</p>
                        <div class="space-y-6">
                            <a href="mailto:{email}" class="flex items-center gap-4 group">
                                <i class="fa-solid fa-at text-2xl text-pink-200"></i>
                                <span class="font-bold break-all group-hover:underline">{email}</span>
                            </a>
                            <a href="{github}" target="_blank" rel="noopener" class="flex items-center gap-4 group">
                                <i class="fa-brands fa-github text-2xl text-pink-200"></i>
                                <span class="font-bold group-hover:underline">GitHub</span>
                            </a>
                            <a href="{linkedin}" target="_blank" rel="noopener" class="flex items-center gap-4 group">
                                <i class="fa-brands fa-linkedin text-2xl text-pink-200"></i>
                                <span class="font-bold group-hover:underline">LinkedIn</span>
                            </a>
                        </div>
                    </div>
                </div>
                <div class="md:col-span-3 p-10">
                    <form action="https://formspree.io/f/your_formspree_id" method="POST" class="space-y-6">
                        <input type="hidden" name="_to" value="{email}">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div>
                                <label class="block text-sm font-bold text-gray-400 mb-2">Name</label>
                                <input type="text" name="name" required class="w-full px-4 py-3 bg-gray-950/60 border border-white/10 text-white rounded-xl focus:ring-2 focus:ring-pink-500 outline-none transition">
                            </div>
                            <div>
                                <label class="block text-sm font-bold text-gray-400 mb-2">Email</label>
                                <input type="email" name="email" required class="w-full px-4 py-3 bg-gray-950/60 border border-white/10 text-white rounded-xl focus:ring-2 focus:ring-pink-500 outline-none transition">
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-gray-400 mb-2">Message</label>
                            <textarea name="message" rows="5" required class="w-full px-4 py-3 bg-gray-950/60 border border-white/10 text-white rounded-xl focus:ring-2 focus:ring-pink-500 outline-none resize-none transition"></textarea>
                        </div>
                        <button type="submit" class="bg-gradient-to-r from-purple-500 to-pink-500 text-white font-bold py-4 px-8 rounded-full hover:opacity-90 transition shadow-lg w-full md:w-auto">
                            Send <i class="fa-solid fa-satellite-dish ml-2"></i>
                        </button>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <footer class="text-center py-12 text-gray-500 text-sm border-t border-white/10 bg-gray-950">
        &copy; 2026 {name}. All rights reserved. Built with PortfoliAI.
    </footer>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>AOS.init({ duration: 700, once: true, offset: 80 });</script>
</body>
</html>
