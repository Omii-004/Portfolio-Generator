<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{name} - Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <style>
        body { font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; }
        .serif-drop { font-family: 'Source Serif 4', Georgia, serif; font-style: italic; letter-spacing: -0.02em; }
        @media (prefers-reduced-motion: reduce) {
            * { animation: none !important; transition: none !important; }
        }
    </style>
</head>
<body class="bg-white text-slate-900 antialiased pt-20">

    <!-- Sticky Nav -->
    <nav class="fixed w-full top-0 z-50 bg-white/85 backdrop-blur-md border-b border-gray-100">
        <div class="max-w-5xl mx-auto px-6 py-4 flex justify-between items-center">
            <a href="#about" class="font-extrabold text-xl tracking-tight">{name}</a>
            <div class="hidden sm:flex gap-8 font-semibold text-sm text-gray-600 items-center">
                <a href="#about" class="hover:text-gray-900 transition">About</a>
                <a href="#experience" class="hover:text-gray-900 transition">Experience</a>
                <a href="#skills" class="hover:text-gray-900 transition">Skills</a>
                <a href="#contact" class="bg-gray-900 text-white hover:bg-gray-700 px-5 py-2 rounded-full transition">Contact</a>
            </div>
        </div>
    </nav>

    <!-- Hero -->
    <header id="about" class="max-w-4xl mx-auto px-6 pt-32 pb-24 text-center" data-aos="fade-up">
        <div class="inline-flex items-center gap-2 bg-gray-100 text-gray-700 px-4 py-1.5 rounded-full text-sm font-bold mb-10">
            <i class="fa-solid fa-circle text-[8px] text-emerald-500"></i> Available for Hire
        </div>
        <h1 class="text-5xl md:text-8xl font-black tracking-tighter leading-none mb-8">
            {name}<span class="serif-drop text-4xl md:text-6xl">.</span>
        </h1>
        <h2 class="text-xl md:text-3xl font-medium text-gray-500 mb-10">{title}</h2>
        <p class="text-lg text-gray-700 leading-relaxed max-w-xl mx-auto mb-10">{summary}</p>
        <div class="h-px w-14 bg-gray-900 mx-auto mb-10" aria-hidden="true"></div>
        <div class="mt-8 flex flex-wrap justify-center gap-4 text-sm font-bold">
            <a href="#contact" class="bg-gray-900 text-white hover:bg-gray-700 px-8 py-4 rounded-full transition shadow-lg hover:-translate-y-0.5">
                <i class="fa-solid fa-envelope mr-2"></i> Hire Me
            </a>
            <a href="#experience" class="border-2 border-gray-300 bg-white hover:border-gray-900 px-8 py-4 rounded-full transition hover:-translate-y-0.5">
                <i class="fa-solid fa-arrow-down mr-2"></i> View Work
            </a>
            <a href="{linkedin}" target="_blank" rel="noopener" class="border-2 border-gray-300 bg-white hover:border-gray-900 px-8 py-4 rounded-full transition hover:-translate-y-0.5">
                <i class="fa-brands fa-linkedin mr-2"></i> LinkedIn
            </a>
            <a href="{github}" target="_blank" rel="noopener" class="border-2 border-gray-300 bg-white hover:border-gray-900 px-8 py-4 rounded-full transition hover:-translate-y-0.5">
                <i class="fa-brands fa-github mr-2"></i> GitHub
            </a>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-6 py-12">

        {all_sections}

        <!-- Contact -->
        <section id="contact" class="mb-20" data-aos="fade-up">
            <div class="grid md:grid-cols-5 rounded-3xl overflow-hidden shadow-xl border border-gray-200">
                <div class="md:col-span-2 bg-gray-900 text-white p-10 flex flex-col justify-between">
                    <div>
                        <h3 class="text-3xl font-black tracking-tight mb-3">Let's Talk</h3>
                        <p class="text-gray-400 leading-relaxed mb-10">Currently looking for new opportunities. Questions or ideas — I'll get back to you.</p>
                        <div class="space-y-6">
                            <a href="mailto:{email}" class="flex items-center gap-4 group">
                                <i class="fa-solid fa-envelope text-xl text-gray-500 transition group-hover:text-white"></i>
                                <span class="font-medium break-all group-hover:underline">{email}</span>
                            </a>
                            <div class="flex items-center gap-4">
                                <i class="fa-solid fa-location-dot text-xl text-gray-500"></i>
                                <span class="font-medium">Available Worldwide</span>
                            </div>
                            <div class="flex gap-6 pt-4">
                                <a href="{linkedin}" target="_blank" rel="noopener" class="text-2xl text-gray-400 hover:text-white transition"><i class="fa-brands fa-linkedin"></i></a>
                                <a href="{github}" target="_blank" rel="noopener" class="text-2xl text-gray-400 hover:text-white transition"><i class="fa-brands fa-github"></i></a>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="md:col-span-3 p-10">
                    <form action="https://formspree.io/f/your_formspree_id" method="POST" class="space-y-6">
                        <input type="hidden" name="_to" value="{email}">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div>
                                <label class="block text-sm font-bold text-gray-700 mb-2">Your Name</label>
                                <input type="text" name="name" required class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-gray-900 outline-none transition">
                            </div>
                            <div>
                                <label class="block text-sm font-bold text-gray-700 mb-2">Your Email</label>
                                <input type="email" name="email" required class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-gray-900 outline-none transition">
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-gray-700 mb-2">Message</label>
                            <textarea name="message" rows="5" required class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-gray-900 outline-none resize-none transition"></textarea>
                        </div>
                        <button type="submit" class="bg-gray-900 text-white font-bold py-4 px-8 rounded-full hover:bg-gray-700 transition shadow-lg w-full md:w-auto">
                            Send Message <i class="fa-solid fa-paper-plane ml-2"></i>
                        </button>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <footer class="text-center py-12 text-gray-400 text-sm border-t border-gray-100">
        &copy; 2026 {name}. All rights reserved.
    </footer>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>AOS.init({ duration: 700, once: true, offset: 80 });</script>
</body>
</html>
